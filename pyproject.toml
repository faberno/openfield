[project]
name = "openfield"
version = "0.1.0"
requires-python = ">=3.11"
description = "GPU-accelerated ultrasound field simulation for Python"
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "openfield contributors" }
]
dependencies = [
  "numpy>=1.24"
]

[project.optional-dependencies]
dev = [
  "pytest>=8"
]
viz = [
  "vedo"
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
